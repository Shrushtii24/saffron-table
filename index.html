<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Saffron Table, a restaurant management system: orders, kitchen board, floor plan, bookings, menu, stock and reports.">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Saffron Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail + scrolling workspace; rail becomes a bottom bar on phones.
   Dark-first kitchen palette: green-black ink, saffron accent, mint secondary. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface2:#F2F5F1; --line:#D6DED4;
  --fg:#14201A; --muted:#58695F; --accent:#B7680A; --accent-ink:#FFFFFF; --accent-soft:#F7E6CB;
  --teal:#17806C; --teal-soft:#D3ECE5; --ok:#1E8A4C; --warn:#B7680A; --bad:#C0392B; --bad-soft:#F6DAD5;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 8px 24px rgba(20,32,26,.07);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1310; --surface:#141D18; --surface2:#1B2721; --line:#263530;
    --fg:#E9F0EA; --muted:#8FA196; --accent:#EDAA45; --accent-ink:#1A1204; --accent-soft:#2C2312;
    --teal:#5FC4AE; --teal-soft:#14302A; --ok:#5CCB8A; --warn:#EDAA45; --bad:#F0806F; --bad-soft:#3A1D19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#141D18; --surface2:#1B2721; --line:#263530;
  --fg:#E9F0EA; --muted:#8FA196; --accent:#EDAA45; --accent-ink:#1A1204; --accent-soft:#2C2312;
  --teal:#5FC4AE; --teal-soft:#14302A; --ok:#5CCB8A; --warn:#EDAA45; --bad:#F0806F; --bad-soft:#3A1D19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font:14.5px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:24px;min-height:100%;max-width:1480px;margin:0 auto}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:20px 0}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:var(--display);font-size:19px;font-weight:800;line-height:1}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:11px;color:var(--muted);font-weight:600;text-align:left;position:relative;transition:background .2s,color .2s}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav .badge[hidden]{display:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.clock{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.clock .t{font-family:var(--mono);font-size:20px;font-weight:500}
.clock .d{color:var(--muted);font-size:12px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,border-color .2s,background .2s}
.ghost:hover{border-color:var(--accent)}
.ghost:active{transform:scale(.97)}

.main{min-width:0;padding:20px 0 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;line-height:1.05}
.top p{margin:6px 0 0;color:var(--muted)}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}
.view{animation:viewIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:11px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.08);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{box-shadow:none;border-color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:17px;font-weight:700;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gE{grid-template-columns:repeat(2,minmax(0,1fr))}

.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px;margin-bottom:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
.hero h2{font-size:clamp(22px,2.6vw,30px);font-weight:800}
.hero p{color:var(--muted);margin:8px 0 14px;max-width:46ch}
.hero .art{display:flex;justify-content:flex-end;min-width:0}
.hero .art svg{max-width:100%;height:auto}
.steam{animation:steam 3.6s ease-in-out infinite;transform-origin:50% 100%;opacity:.0}
.steam:nth-child(2){animation-delay:1.1s}.steam:nth-child(3){animation-delay:2.2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.8)}40%{opacity:.7}100%{opacity:0;transform:translateY(-14px) scaleY(1.1)}}

.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--display);font-size:clamp(24px,2.6vw,32px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12.5px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi svg.spark{position:absolute;right:10px;bottom:10px;width:84px;height:34px;opacity:.9}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.s-new{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.s-prep{color:var(--teal);background:var(--teal-soft);border-color:transparent}
.s-ready{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:transparent}
.s-served{color:var(--muted)}
.s-paid{color:var(--muted)}
.s-free{color:var(--ok)}
.s-occ{color:var(--accent)}
.s-res{color:var(--teal)}
.s-bill{color:var(--bad);background:var(--bad-soft);border-color:transparent}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted)}

.bar{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar.low>i{background:var(--bad)}.bar.mid>i{background:var(--warn)}.bar.good>i{background:var(--teal)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--fg);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pos-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.pos-tools .search{flex:1;min-width:160px}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .2s;animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.dish:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.dish:active{transform:scale(.97)}
.dish .img{aspect-ratio:4/3;width:100%;overflow:hidden;background:var(--surface2)}
.dish .img svg{width:100%;height:100%;display:block;transition:transform .5s}
.dish:hover .img svg{transform:scale(1.06) rotate(-1.5deg)}
.dish .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.dish .nm{font-weight:700;line-height:1.2}
.dish .pr{font-family:var(--mono);color:var(--accent);font-weight:500}
.dish.off{opacity:.5;pointer-events:none;filter:grayscale(1)}
.veg{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ok);border-radius:3px;position:relative;vertical-align:-1px;margin-right:6px}
.veg::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--ok)}
.veg.nv{border-color:var(--bad)}.veg.nv::after{background:var(--bad)}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 32px)}
.cart-items{overflow:auto;min-height:60px;display:flex;flex-direction:column}
.ci{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);animation:pop .3s both}
.ci:first-child{border-top:0}
.ci .grow{flex:1;min-width:0}.ci .grow b{display:block;font-size:13.5px}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:9px;border:1px solid var(--line)}
.qty button{border:0;background:none;width:26px;height:26px;font-weight:700;border-radius:8px}
.qty button:hover{background:var(--accent-soft)}
.qty span{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px}
.sumrow{display:flex;justify-content:space-between;color:var(--muted)}
.sumrow.t{color:var(--fg);font-family:var(--display);font-size:22px;font-weight:800;padding-top:6px;border-top:1px dashed var(--line)}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:28px 10px;gap:8px}

/* Kitchen */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.col>h3{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.col>h3 span{font-family:var(--mono);font-weight:500;color:var(--muted)}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;animation:pop .4s both;border-left:4px solid var(--accent)}
.tk.prep{border-left-color:var(--teal)}.tk.ready{border-left-color:var(--ok)}.tk.served{border-left-color:var(--muted)}
.tk .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk .h b{font-family:var(--display);font-size:16px}
.tk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.tk li{display:flex;gap:8px}.tk li span:first-child{font-family:var(--mono);color:var(--accent);min-width:24px}
.tk .late{color:var(--bad)}
.tk .foot{display:flex;gap:8px;justify-content:space-between;align-items:center}

/* Tables */
.floor{position:relative;border:1px dashed var(--line);border-radius:18px;padding:22px;background:
  radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,var(--surface)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.tbl{position:relative;border:0;background:none;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:16px;transition:transform .25s,background .2s}
.tbl:hover{transform:translateY(-4px);background:var(--surface2)}
.tbl svg{width:100%;max-width:120px;height:auto;overflow:visible}
.tbl .tn{font-family:var(--display);font-weight:800;font-size:18px}
.tbl .seat{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,10,8,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .3s both}
.modal h2{font-size:22px;font-weight:800;margin-bottom:4px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:flex-end}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);animation:pop .3s both}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.chartbox{position:relative;width:100%}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.ax{fill:var(--muted);font:11px var(--mono)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lg{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.pos{grid-template-columns:minmax(0,1fr)}.cart{position:static;max-height:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:40;gap:0}
  .brand,.rail-foot .clock{display:none}
  .rail-foot{margin:0;flex-direction:row}
  .nav{flex-direction:row;overflow-x:auto;flex:1;gap:0;scrollbar-width:none}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 10px;flex:none;align-items:center}
  .nav .badge{position:absolute;top:0;right:2px;margin:0}
  .main{padding-bottom:96px}
  .g2,.g3,.gE,.hero{grid-template-columns:minmax(0,1fr)}
  .hero .art{justify-content:flex-start}
}
@media (max-width:560px){.g4{grid-template-columns:minmax(0,1fr)}.board{grid-template-columns:minmax(0,1fr)}.form{grid-template-columns:minmax(0,1fr)}.dishes{grid-template-columns:repeat(2,minmax(0,1fr))}.top .actions{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
<style>
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.quiet .view,.quiet .tk,.quiet .dish,.quiet .ci{animation:none!important}
.nav button:hover svg{transform:scale(1.12)}
.nav button svg{transition:transform .2s}
.top .actions .btn,.hero .btn{white-space:nowrap}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2 3 5 4.5 5 8.5A5 5 0 0 1 7 12c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 .5-2-.5-4 1-7z"/><path d="M4 21h16"/></svg></div>
      <div><b>Saffron Table</b><small>Restaurant OS</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="clock"><div class="t" id="clockT">--:--</div><div class="d" id="clockD"></div></div>
      <button class="ghost" id="themeBtn" type="button" aria-label="Toggle light or dark theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="tlabel">Theme</span>
      </button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

/* ---------- state + persistence ---------- */
const KEY="saffron-table.v1";

function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedState(){
  const r=rngFrom(20261014), now=Date.now(), sod=new Date();sod.setHours(0,0,0,0);
  const st={menu:JSON.parse(JSON.stringify(MENU)),inv:JSON.parse(JSON.stringify(INGR)),
    tables:TABLES.map(t=>({...t,status:"free"})),orders:[],res:[],no:100,seeded:now};
  const pickItem=()=>{const w=[3,2,3,1,5,3,3,2,4,2,5,4,2,2,4,2,2,2];let s=w.reduce((a,b)=>a+b),x=r()*s,i=0;while(x>w[i]){x-=w[i];i++}return st.menu[i]};
  const mk=(t,status)=>{
    const n=1+Math.floor(r()*4),items=[];
    for(let i=0;i<n;i++){const m=pickItem(),q=1+Math.floor(r()*2),f=items.find(x=>x.id===m.id);f?f.q+=q:items.push({id:m.id,q})}
    const sub=items.reduce((a,x)=>a+x.q*st.menu.find(m=>m.id===x.id).price,0);
    const disc=r()<.08?Math.round(sub*.1):0, tax=(sub-disc)*GST;
    return{id:uid(),no:++st.no,table:r()<.18?"Takeaway":1+Math.floor(r()*12),items,status,created:t,subtotal:sub,disc,tax,total:sub-disc+tax,
      pay:status==="paid"?["UPI","Card","Cash"][Math.floor(r()*3.2)%3]:null,guests:2+Math.floor(r()*4)};
  };
  for(let d=6;d>=0;d--){
    const base=new Date(sod);base.setDate(base.getDate()-d);
    const wk=[0,6].includes(base.getDay())?1.35:1, cnt=Math.round((28+r()*14)*wk);
    for(let i=0;i<cnt;i++){
      const lunch=r()<.42, hr=lunch?12+r()*2.6:19+r()*3.2;
      const t=base.getTime()+hr*3600000;
      if(t>now-25*60000)continue;
      st.orders.push(mk(t,"paid"));
    }
  }
  const t0=st.orders.length;
  // live tickets
  const live=[["new",3,4],["prep",7,14],["ready",5,22],["served",9,38]];
  const used=new Set();
  live.forEach(([s,tb,ago])=>{const o=mk(now-ago*60000,s);o.table=tb;used.add(tb);st.orders.push(o);
    const T=st.tables.find(x=>x.id===tb);T.status="occupied"});
  st.orders.sort((a,b)=>a.created-b.created);

}

function tableState(t){

/* ---------- dish artwork (drawn, no external images) ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function art(m){
  const r=rngFrom(hash(m.id)), h=m.hue, id="g"+hash(m.id);
  const col=(l,s=70,dh=0)=>`hsl(${h+dh} ${s}% ${l}%)`;
  let s=`<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(m.name)}"><defs>

    s+=herbs(80,62,34,16,9);
  }else if(m.kind==="skewer"){

    for(let i=0;i<4;i++){const x=46+i*22,y=76-i*6.4;s+=`<g transform="rotate(-16 ${x} ${y})"><rect x="${x-10}" y="${y-9}" width="20" height="17" rx="5" fill="${col(48,80)}" stroke="${col(28,70)}" stroke-width="1.2"/><path d="M${x-6} ${y-3}l5 4M${x+1} ${y-5}l5 4" stroke="${col(22,70)}" stroke-width="1.6" stroke-linecap="round"/></g>`}
    s+=`<circle cx="124" cy="84" r="9" fill="#f6e04a"/><circle cx="124" cy="84" r="5.5" fill="#fdf2a0"/>`+herbs(60,86,28,6,6);
  }else if(m.kind==="bowl"){
    s+=plate(80,70,60,36)+`<path d="M34 62a46 34 0 0 0 92 0z" fill="${col(70,30)}"/><ellipse cx="80" cy="62" rx="46" ry="14" fill="${col(55,70)}"/>`;
    for(let i=0;i<22;i++){const x=40+r()*80,y=54+r()*12;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2+r()*2.2).toFixed(1)}" fill="${["#f4c430","#e8573d","#7cc15f","#fff2c6"][i%4]}"/>`}
  }else if(m.kind==="rice"){
    s+=plate(80,68,64,40)+`<path d="M34 76c0-26 20-40 46-40s46 14 46 40c0 6-92 6-92 0z" fill="${col(78,35)}"/><path d="M34 76c0-26 20-40 46-40s46 14 46 40" fill="none" stroke="${col(55,60)}" stroke-width="2"/>`;
    for(let i=0;i<46;i++){const a=r()*3.14,d=Math.sqrt(r()),x=80-Math.cos(a)*40*d,y=76-Math.sin(a)*36*d;s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3.2" ry="1.2" transform="rotate(${Math.round(r()*180)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${["#fff3cf","#f2c14e","#e6a23c","#fffbea"][i%4]}"/>`}
    s+=herbs(80,50,18,8,5)+`<circle cx="92" cy="46" r="5" fill="#8c3b1c"/>`;
  }else if(m.kind==="bread"){
    s+=`<ellipse cx="80" cy="66" rx="62" ry="38" fill="#000" opacity=".25" transform="translate(0 5)"/><path d="M26 74C30 40 66 24 108 30c22 3 30 22 24 40-6 18-34 26-60 22S22 90 26 74z" fill="${col(62,60)}"/><path d="M26 74C30 40 66 24 108 30c22 3 30 22 24 40-6 18-34 26-60 22S22 90 26 74z" fill="none" stroke="${col(40,60)}" stroke-width="2"/>`;
    for(let i=0;i<14;i++){const x=40+r()*80,y=40+r()*40;s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(3+r()*4).toFixed(1)}" ry="${(2+r()*2.5).toFixed(1)}" fill="${col(30,55)}" opacity=".7"/>`}

/* ---------- toast + modal ---------- */
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toasts").appendChild(t);setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(()=>t.remove(),320)},2400)}
function modal(html,onMount){
  closeModal();
  const root=$("#modalRoot");
  root.innerHTML=`<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  root.firstChild.addEventListener("mousedown",e=>{if(e.target.dataset.close)closeModal()});
  const first=$("input,select,button.btn",root);first&&first.focus();
  onMount&&onMount(root.firstChild);
}
function closeModal(){$("#modalRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

/* ---------- core actions ---------- */
function calc(items,disc){
  const sub=items.reduce((a,x)=>a+x.q*itemOf(x.id).price,0);
  const d=Math.min(sub,Math.round(sub*(disc||0)/100)), tax=(sub-d)*GST;
  return{sub,d,tax,total:sub-d+tax};
}
function placeOrder(table,items,discPct){
  const c=calc(items,discPct);
  items.forEach(x=>{const m=itemOf(x.id);Object.entries(m.ing||{}).forEach(([k,q])=>{const g=ingOf(k);if(g)g.stock=Math.max(0,+(g.stock-q*x.q).toFixed(3))})});
  const o={id:uid(),no:++S.no,table,items:items.map(x=>({...x})),status:"new",created:Date.now(),subtotal:c.sub,disc:c.d,tax:c.tax,total:c.total,pay:null,guests:0};
  S.orders.push(o);
  if(table!=="Takeaway"){const T=S.tables.find(t=>t.id===table);if(T)T.status="occupied"}
  save();updateBadges();return o;
}
const FLOW=["new","prep","ready","served"];
function advance(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const i=FLOW.indexOf(o.status);if(i<0||i>=FLOW.length-1)return;
  o.status=FLOW[i+1];o.updated=Date.now();save();updateBadges();
  toast(`Order #${o.no} is ${statusLabel(o.status).toLowerCase()}`);
}
const statusLabel=s=>({new:"New",prep:"Preparing",ready:"Ready",served:"Served",paid:"Paid"}[s]);
function payOrders(ids,method){
  const os=S.orders.filter(o=>ids.includes(o.id));
  os.forEach(o=>{o.status="paid";o.pay=method;o.paidAt=Date.now()});
  const tabs=new Set(os.map(o=>o.table).filter(t=>t!=="Takeaway"));
  tabs.forEach(tid=>{if(!tableOrders(tid).length){const T=S.tables.find(t=>t.id===tid);if(T)T.status="free"}});
  save();updateBadges();
}
function updateBadges(){
  const n=activeOrders().filter(o=>o.status==="new"||o.status==="prep").length;
  const b=$("#navBadgeKit");if(b){b.textContent=n;b.hidden=!n}
  const l=lowStock().length,bi=$("#navBadgeInv");if(bi){bi.textContent=l;bi.hidden=!l}
}

function niceMax(v){if(v<=0)return 10;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function areaChart(vals,labels,opts={}){
  const W=640,H=230,L=46,R=14,T=14,B=28,max=niceMax(Math.max(...vals,1)),n=vals.length;
  const x=i=>L+(n===1?0:i*(W-L-R)/(n-1)), y=v=>T+(H-T-B)*(1-v/max);
  let grid="";for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="${k?"3 5":"0"}"/><text class="ax" x="${L-8}" y="${yy+4}" text-anchor="end">${v>=1000?(v/1000).toFixed(v%1000?1:0)+"k":v}</text>`}
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  // smooth path
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<n;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}
  const area=d+` L${x(n-1)} ${H-B} L${x(0)} ${H-B} Z`;
  const step=Math.ceil(n/8);
  let xl="";labels.forEach((l,i)=>{if(i%step===0||i===n-1)xl+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  const li=vals.reduce((a,v,i)=>v>0?i:a,0),gid="ag"+uid();
  return`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"Chart")}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".38"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
  ${grid}${xl}<path d="${area}" fill="url(#${gid})" style="animation:fade .9s .3s both"/>
  <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:draw 1.3s .1s cubic-bezier(.3,.7,.2,1) forwards"/>
  <circle cx="${pts[li][0]}" cy="${pts[li][1]}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5" style="animation:fade .4s 1.2s both"/></svg></div>`;
}
function barChart(vals,labels,hi){
  const W=640,H=230,L=46,R=10,T=14,B=28,max=niceMax(Math.max(...vals,1)),n=vals.length,bw=(W-L-R)/n;
  let g="";for(let k=0;k<=4;k++){const v=max*k/4,yy=T+(H-T-B)*(1-v/max);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="${k?"3 5":"0"}"/><text class="ax" x="${L-8}" y="${yy+4}" text-anchor="end">${v>=1000?(v/1000).toFixed(v%1000?1:0)+"k":v}</text>`}
  let b="";vals.forEach((v,i)=>{const h=(H-T-B)*v/max,xx=L+i*bw+bw*.2;b+=`<rect x="${xx}" y="${H-B-h}" width="${bw*.6}" height="${h}" rx="6" fill="${i===hi?"var(--accent)":"var(--teal)"}" opacity="${i===hi?1:.75}" style="transform-origin:${xx+bw*.3}px ${H-B}px;animation:grow .8s ${i*.07}s cubic-bezier(.2,.7,.2,1) both"><title>${labels[i]}: ${inr(v)}</title></rect><text class="ax" x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales for the last 7 days">${g}${b}</svg></div>`;
}
function donut(parts){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1,R=46,C=2*Math.PI*R,colors=["var(--accent)","var(--teal)","#8E7CC3","#E0645C","#6FA8DC","#B5B24A"];
  let off=0,arcs="";
  parts.forEach((p,i)=>{const len=C*p.v/tot;arcs+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${colors[i%6]}" stroke-width="16" stroke-dasharray="${Math.max(len-2,0)} ${C-Math.max(len-2,0)}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)" style="animation:fade .5s ${i*.12}s both"><title>${esc(p.l)}: ${inr(p.v)}</title></circle>`;off+=len});
  const lg=parts.map((p,i)=>`<div><i style="background:${colors[i%6]}"></i>${esc(p.l)} <span class="muted num">${Math.round(p.v*100/tot)}%</span></div>`).join("");
  return`<div class="donut-wrap"><svg width="132" height="132" viewBox="0 0 120 120" role="img" aria-label="Sales by category">${arcs}<text x="60" y="58" text-anchor="middle" class="ax" style="font-size:9px">TOTAL</text><text x="60" y="73" text-anchor="middle" style="font:700 13px var(--display);fill:var(--fg)">${inr(tot)}</text></svg><div class="lg">${lg}</div></div>`;
}
function spark(vals,w=84,h=34){
  const max=Math.max(...vals,1),min=Math.min(...vals),n=vals.length,sp=max-min||1;
  const p=vals.map((v,i)=>`${(i*(w-6)/(n-1)+3).toFixed(1)},${(h-4-(h-8)*(v-min)/sp).toFixed(1)}`);
  const last=p[n-1].split(",");
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${p.join(" ")}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--teal)"/></svg>`;
}
function countUp(root){
  $$("[data-count]",root).forEach(el=>{
    const to=+el.dataset.count,fmt=el.dataset.fmt,t0=performance.now(),dur=900;
    const f=v=>fmt==="inr"?inr(v):fmt==="pct"?Math.round(v)+"%":Math.round(v).toLocaleString("en-IN");
    const tick=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(to*e);if(k<1)requestAnimationFrame(tick)};
    requestAnimationFrame(tick);
  });
}
const sumTotal=os=>os.reduce((a,o)=>a+o.total,0);
function ordersOnDay(k){return S.orders.filter(o=>dayKey(o.created)===k)}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);out.push({k:dayKey(d),d,label:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]})}return out}
function catOf(o){const m={};o.items.forEach(x=>{const it=itemOf(x.id);if(it)m[it.cat]=(m[it.cat]||0)+x.q*it.price});return m}

  <div class="foot"><span class="mono muted">${inr(o.total)}</span>${next?`<button class="btn sm" type="button" data-adv="${o.id}">${next}</button>`:`<button class="btn sm" type="button" data-bill="${o.id}">Take payment</button>`}</div></article>`;

  let chairs="";

/* ---------- live simulation ---------- */
function rush(){
  const free=S.tables.filter(t=>tableState(t)==="free"),avail=S.menu.filter(isAvail);
  if(!avail.length){toast("No dishes are in stock");return}
  const n=3;let made=0;
  for(let i=0;i<n;i++){
    const items=[],k=1+Math.floor(Math.random()*4);
    for(let j=0;j<k;j++){const m=avail[Math.floor(Math.random()*avail.length)];if(!isAvail(m))continue;const f=items.find(x=>x.id===m.id);f?f.q++:items.push({id:m.id,q:1})}
    if(!items.length)continue;
    const tb=free.length&&Math.random()<.8?free.splice(Math.floor(Math.random()*free.length),1)[0].id:"Takeaway";
    placeOrder(tb,items,0);made++;
  }
  toast(`${made} new orders hit the kitchen`);refresh();
}

/* ---------- global events ---------- */
document.addEventListener("click",e=>{
  const t=e.target,q=s=>t.closest(s);let el;
  if((el=q("[data-go]"))&&!q("#modalRoot")){go(el.dataset.go);return}
  if((el=q("[data-add]"))){addToCart(el.dataset.add);return}
  if((el=q("[data-inc]"))){addToCart(el.dataset.inc);return}
  if((el=q("[data-dec]"))){const f=POS.cart.find(x=>x.id===el.dataset.dec);if(f){f.q--;if(f.q<=0)POS.cart=POS.cart.filter(x=>x!==f)}drawCart();return}
  if((el=q("[data-cat]"))){POS.cat=el.dataset.cat;$$("#cats .chip").forEach(c=>c.setAttribute("aria-pressed",c===el));drawDishes();return}
  if((el=q("[data-adv]"))){advance(el.dataset.adv);refresh();return}
  if((el=q("[data-bill]"))){openBill([el.dataset.bill]);return}
  if((el=q("[data-table]"))){openTable(+el.dataset.table);return}
  if((el=q("[data-seatres]"))){const r=S.res.find(x=>x.id===el.dataset.seatres),T=S.tables.find(x=>x.id===r.table);r.status="seated";T.status="occupied";save();toast(`${r.name} is seated at table ${T.id}`);refresh();return}
  if((el=q("[data-cancelres]"))){const r=S.res.find(x=>x.id===el.dataset.cancelres);r.status="cancelled";const T=S.tables.find(x=>x.id===r.table);
    if(T.status==="reserved"&&!S.res.some(x=>x.status==="booked"&&x.table===T.id&&x.date===todayKey()))T.status="free";save();toast("Booking cancelled");refresh();return}
  if((el=q("[data-toggle]"))){const m=itemOf(el.dataset.toggle);m.on=el.checked;save();toast(`${m.name} is ${el.checked?"on":"off"} the menu`);refresh();return}
  if((el=q("[data-edit]"))){dishForm(el.dataset.edit);return}
  if((el=q("[data-del]"))){const m=itemOf(el.dataset.del);confirmBox(`Delete ${m.name}?`,()=>{S.menu=S.menu.filter(x=>x!==m);POS.cart=POS.cart.filter(x=>x.id!==m.id);save();toast("Dish deleted");refresh()});return}
  if((el=q("[data-restock]"))){restockForm(el.dataset.restock);return}
  if((el=q("[data-act]"))){
    const a=el.dataset.act;
    if(a==="rush")rush();
    else if(a==="addDish")dishForm();
    else if(a==="clearCart"){POS.cart=[];POS.disc=0;drawCart()}
    else if(a==="sendOrder"){
      if(!POS.cart.length)return;
      const T=S.tables.find(x=>x.id===POS.table);
      if(T&&tableState(T)==="res"){toast("That table is reserved");return}
      const o=placeOrder(POS.table,POS.cart,POS.disc);
      POS.cart=[];POS.disc=0;toast(`Order #${o.no} sent to the kitchen`);go("kitchen");
    }
  }
});

function effDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("saffron-theme",t)}catch(e){}$(".tlabel").textContent=t==="dark"?"Dark mode":"Light mode"}
try{const t=localStorage.getItem("saffron-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#themeBtn").addEventListener("click",()=>setTheme(effDark()?"light":"dark"));
$(".tlabel").textContent=effDark()?"Dark mode":"Light mode";
function tick(){const d=new Date();$("#clockT").textContent=pad(d.getHours())+":"+pad(d.getMinutes());$("#clockD").textContent=d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
tick();setInterval(tick,15000);
setInterval(()=>{if(cur==="kitchen"&&!$("#modalRoot").firstChild)refresh()},30000);

buildNav();
{const h=location.hash.slice(1);go(ORDER.includes(h)?h:"dash")}
</script>
